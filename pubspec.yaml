name: done_daily
description: "DONE:Daily - Complete your daily goals and actually rest."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Routing
  go_router: ^13.0.0
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  
  # UI
  intl: ^0.19.0
  
  # Utils
  equatable: ^2.0.5
  uuid: ^4.0.0

  # Backup / export
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # URL launcher
  url_launcher: ^6.3.0

  # File picker (for backup restore)
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icons/android/play_store_512.png